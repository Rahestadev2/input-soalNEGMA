<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Input Soal — SMP Negeri 5 Cikalongkulon</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:         #064e4a;
  --accent:       #0d9488;
  --accent-soft:  #ccfbf1;
  --accent-mid:   #2dd4bf;
  --success:      #16a34a;
  --success-soft: #dcfce7;
  --danger:       #dc2626;
  --danger-soft:  #fee2e2;
  --warn:         #d97706;
  --warn-soft:    #fef3c7;
  --info:         #0e7490;
  --info-soft:    #cffafe;
  --bg:           #cdf4ee;
  --surface:      #ffffff;
  --border:       #b3e2da;
  --text:         #0b2e2d;
  --muted:        #64748b;
  --radius:       16px;
  --radius-sm:    11px;
  --radius-xs:    8px;
  --shadow:       0 4px 24px rgba(13,148,136,.10);
  --font:         'Nunito', sans-serif;
  --mono:         'JetBrains Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px 12px 120px;
  -webkit-text-size-adjust: 100%;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.container { max-width: 860px; margin: 0 auto; }

/* TOAST */
#toast-container {
  position: fixed; top: 12px; left: 12px; right: 12px;
  z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0,0,0,.14);
  pointer-events: all;
  animation: toastIn .3s cubic-bezier(.34,1.56,.64,1);
  transition: opacity .3s, transform .3s;
}
.toast.out { opacity: 0; transform: translateY(-10px); }
.toast-icon {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 11px; font-weight: 800; margin-top: 1px;
}
.toast-icon.success { background: var(--success-soft); color: var(--success); }
.toast-icon.error   { background: var(--danger-soft);  color: var(--danger); }
.toast-icon.info    { background: var(--info-soft);    color: var(--info); }
.toast-icon.warn    { background: var(--warn-soft);    color: var(--warn); }
.toast-body .t-title { font-size: 13px; font-weight: 700; color: var(--text); }
.toast-body .t-msg   { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
@keyframes toastIn { from { opacity:0; transform:translateY(-12px) scale(.97); } to { opacity:1; transform:none; } }

/* MODAL */
#modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,41,.55);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 9998; backdrop-filter: blur(3px);
}
#modal-overlay.show { display: flex; }
.modal-box {
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 20px 20px 32px;
  width: 100%; max-width: 560px;
  box-shadow: 0 -10px 50px rgba(0,0,0,.2);
  animation: slideUp .3s cubic-bezier(.34,1.56,.64,1);
  max-height: 88vh; overflow-y: auto;
}
@media (min-width: 600px) {
  #modal-overlay { align-items: center; }
  .modal-box { border-radius: var(--radius); padding: 28px; }
}
@keyframes slideUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:none; } }
.modal-drag { width: 38px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 18px; }
.modal-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.modal-title-text { font-size: 17px; font-weight: 800; }
.modal-close {
  background: var(--bg); border: none; cursor: pointer; font-size: 14px;
  color: var(--muted); width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; transition: .15s;
}
.modal-close:hover { color: var(--text); background: var(--border); }
.modal-footer-row {
  display: flex; flex-direction: column; gap: 8px;
  margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
}
@media (min-width: 480px) { .modal-footer-row { flex-direction: row; justify-content: flex-end; } }
.modal-btn {
  padding: 12px 22px; border-radius: var(--radius-sm); border: none;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: .15s;
  text-align: center; font-family: var(--font);
}
.modal-btn.primary { background: var(--accent); color: #fff; }
.modal-btn.primary:hover { background: #0b7a70; }
.modal-btn.ghost  { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
.modal-btn.danger { background: var(--danger); color: #fff; }

/* PAGE HEADER */
.page-header {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 24px 20px 20px;
  margin-bottom: 18px;
  text-align: center;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.page-header::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--accent), #0f9d8f, #0d9488);
}
.logo-ring {
  width: 56px; height: 56px; border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), #0f9d8f);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px; font-size: 24px;
  box-shadow: 0 8px 20px rgba(13,148,136,.3);
}
.page-header h1 { font-size: 22px; font-weight: 900; margin-bottom: 3px; }
.page-header p  { font-size: 13px; color: var(--muted); }

.autosave-status {
  margin-top: 12px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.autosave-status.local   { background: var(--success-soft); color: var(--success); }
.autosave-status.unsaved { background: var(--warn-soft);    color: var(--warn); }
.autosave-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.autosave-status.local .autosave-dot   { background: var(--success); }
.autosave-status.unsaved .autosave-dot { background: var(--warn); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

.restore-banner {
  background: linear-gradient(135deg, #e6fbf7, #ccfbf1);
  border: 1.5px solid #7dd8cb;
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex-wrap: wrap;
}
.restore-banner p { font-size: 13px; color: #0b6b63; font-weight: 700; }
.restore-banner small { font-size: 11px; color: var(--muted); display: block; font-weight: 500; }
.restore-actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn-restore {
  padding: 8px 14px; border-radius: var(--radius-xs); border: none;
  font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font);
}
.btn-restore.yes { background: var(--accent); color: #fff; }
.btn-restore.no  { background: var(--border); color: var(--muted); }

.prefix-row {
  display: flex; align-items: stretch; gap: 0;
  max-width: 340px; margin: 16px auto 0;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
}
.prefix-row .prefix-label {
  padding: 10px 13px; background: var(--bg);
  font-size: 11px; font-weight: 700; color: var(--muted);
  display: flex; align-items: center; white-space: nowrap;
  border-right: 1.5px solid var(--border);
}
.prefix-row input {
  flex: 1; padding: 10px 12px; border: none; outline: none;
  font-size: 14px; font-family: var(--font); color: var(--text);
  background: var(--surface); min-width: 0;
}

/* MAPEL PANEL */
.mapel-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  border-top: 4px solid #0f9d8f;
  padding: 18px 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.mapel-panel-title {
  font-size: 13px; font-weight: 800;
  color: #0f9d8f; text-transform: uppercase; letter-spacing: .06em;
  margin-bottom: 14px; display: flex; align-items: center; gap: 7px;
}
.mapel-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 480px) { .mapel-grid { grid-template-columns: 1fr; } }

/* FORM FIELDS */
.field-group { display: flex; flex-direction: column; gap: 5px; }
.field-group label {
  font-size: 10px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
}
.fi {
  padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-xs);
  font-size: 14px; font-family: var(--font); color: var(--text);
  background: var(--surface); outline: none; transition: border-color .2s; width: 100%;
}
.fi:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,.12); }
.fi::placeholder { color: var(--muted); opacity: .7; }
input[type="password"].fi { letter-spacing: .1em; }
textarea.fi { resize: vertical; min-height: 76px; line-height: 1.55; }

/* SOAL CARD */
.soal-card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  border-top: 4px solid var(--accent);
  padding: 20px 18px 18px;
  margin-bottom: 14px;
  position: relative;
  box-shadow: var(--shadow);
  animation: cardIn .3s ease;
}
.soal-card.local-saved   { border-top-color: var(--success); }
.soal-card.local-unsaved { border-top-color: var(--warn); }

@keyframes cardIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

.nomor-soal {
  position: absolute; top: -14px; left: 18px;
  background: var(--accent); color: #fff;
  padding: 4px 16px; border-radius: 99px;
  font-size: 11px; font-weight: 800; letter-spacing: .06em;
  box-shadow: 0 3px 10px rgba(13,148,136,.35);
}

.card-local-badge {
  position: absolute; top: 10px; right: 10px;
  font-size: 10px; font-weight: 800;
  padding: 3px 10px; border-radius: 99px;
}
.card-local-badge.saved   { background: var(--success-soft); color: var(--success); }
.card-local-badge.unsaved { background: var(--warn-soft);    color: var(--warn); animation: pulse 1.2s infinite; }

.card-meta-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px; align-items: flex-end;
  margin-bottom: 14px; margin-top: 10px;
}
.stepper {
  display: flex; align-items: stretch;
  border: 1.5px solid var(--border); border-radius: var(--radius-xs);
  overflow: hidden; background: var(--surface);
}
.step-btn {
  width: 40px; min-height: 42px; border: none; background: var(--accent-soft);
  color: var(--accent); font-size: 20px; font-weight: 800;
  cursor: pointer; font-family: var(--font); transition: .15s;
}
.step-btn:active, .step-btn:hover { background: var(--accent); color: #fff; }
.stepper .jmlPilihan {
  width: 42px; text-align: center; border: none; outline: none;
  font-size: 15px; font-weight: 800; font-family: var(--font);
  color: var(--text); background: var(--surface); padding: 0;
  -moz-appearance: textfield;
}
.stepper .jmlPilihan::-webkit-outer-spin-button,
.stepper .jmlPilihan::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.btn-hapus {
  padding: 10px 12px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 12px; font-weight: 700; color: var(--danger);
  cursor: pointer; transition: .15s; white-space: nowrap;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  font-family: var(--font);
}
.btn-hapus:active, .btn-hapus:hover { background: var(--danger-soft); border-color: var(--danger); }

/* FILE SECTION */
.file-section {
  background: var(--bg); border: 1.5px dashed var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 14px;
}
.file-section label {
  font-size: 10px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
  display: block; margin-bottom: 6px;
}
input[type="file"].fi-file {
  width: 100%; padding: 5px; border: 1.5px solid var(--border);
  border-radius: var(--radius-xs); font-size: 12px; font-family: var(--font);
  background: var(--surface); color: var(--text); cursor: pointer;
}

/* LINK GAMBAR & LAMPIRAN FILE */
.link-row { display: flex; gap: 6px; margin-top: 8px; }
.link-row .fi { padding: 8px 10px; font-size: 13px; min-width: 0; }
.btn-link {
  padding: 8px 14px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--accent);
  font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap;
  font-family: var(--font); transition: .15s; flex-shrink: 0;
}
.btn-link:hover { background: var(--accent); color: #fff; }
.btn-link:disabled { opacity: .6; cursor: wait; }
.btn-del-mini {
  font-size: 11px; color: var(--danger); background: var(--danger-soft);
  border: 1px solid var(--danger); border-radius: 6px; padding: 3px 10px;
  cursor: pointer; font-family: var(--font); font-weight: 700;
}
.img-preview-soal { max-width: 100%; max-height: 160px; border-radius: 8px; border: 1px solid var(--border); display: block; }
.img-src-note { font-size: 11px; color: var(--muted); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.img-preview-wrap .btn-del-mini { margin-top: 6px; }
.lampiran-chip {
  display: flex; align-items: center; gap: 8px; margin-top: 8px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius-xs); padding: 7px 10px; font-size: 13px; font-weight: 600;
}
.lampiran-nama { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lampiran-size { color: var(--muted); font-weight: 700; flex-shrink: 0; }
.opt-link-toggle {
  width: 32px; height: 32px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; cursor: pointer; flex-shrink: 0; transition: .15s;
}
.opt-link-toggle:hover, .opt-link-toggle:active { background: var(--accent-soft); border-color: var(--accent-mid); }
.opt-link-row { display: none; gap: 6px; margin: 4px 0 4px 38px; }
.opt-link-row.show { display: flex; }
.opt-link-row .fi { padding: 7px 10px; font-size: 13px; min-width: 0; }
.pv-lampiran {
  display: inline-block; margin-bottom: 10px; padding: 5px 12px; font-size: 12px; font-weight: 700;
  background: var(--bg); border: 1px solid var(--border); border-radius: 99px;
}

/* OPTIONS */
.opsi-wrapper { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
.option-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-xs); padding: 8px 10px;
  transition: border-color .15s;
}
.option-row:focus-within { border-color: var(--accent-mid); }
.opt-label {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.opt-input {
  flex: 1; padding: 8px 10px; border: 1.5px solid var(--border);
  border-radius: var(--radius-xs); font-size: 14px; font-family: var(--font);
  color: var(--text); background: var(--surface); outline: none;
  transition: border-color .2s; min-width: 0;
}
.opt-input:focus { border-color: var(--accent); }

.opt-file { display: none; }
@media (min-width: 640px) {
  .opt-file {
    display: block; width: 160px; padding: 5px 7px;
    border: 1.5px solid var(--border); border-radius: var(--radius-xs);
    font-size: 11px; font-family: var(--font);
    background: var(--surface); color: var(--text); cursor: pointer; flex-shrink: 0;
  }
}
.opt-img-toggle {
  width: 32px; height: 32px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; cursor: pointer; flex-shrink: 0; color: var(--muted); transition: .15s;
}
.opt-img-toggle:active { background: var(--bg); }
.opt-file-mobile {
  margin-top: 6px; padding: 5px 7px;
  border: 1.5px dashed var(--border); border-radius: var(--radius-xs);
  font-size: 11px; font-family: var(--font);
  background: var(--surface); color: var(--text); cursor: pointer; width: 100%; display: none;
}
@media (min-width: 640px) { .opt-img-toggle, .opt-file-mobile { display: none !important; } }

/* KUNCI JAWABAN */
.kunci-row { display: flex; align-items: center; gap: 12px; }
.kunci-row label {
  font-size: 10px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
}
.kunci-input {
  width: 64px; padding: 10px 8px; text-align: center;
  border: 2px solid var(--border); border-radius: var(--radius-sm);
  font-size: 24px; font-weight: 900; color: var(--accent);
  font-family: var(--font); text-transform: uppercase; outline: none;
  transition: border-color .2s; background: var(--accent-soft);
}
.kunci-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,.15); }

/* ADD BUTTON */
.add-btn-wrap { text-align: center; margin: 20px 0; }
.btn-add {
  padding: 15px 32px; border-radius: 99px;
  border: 2.5px dashed var(--accent); background: var(--accent-soft);
  color: var(--accent); font-size: 14px; font-weight: 800;
  cursor: pointer; transition: .2s; width: 100%; max-width: 380px;
  font-family: var(--font);
}
.btn-add:active, .btn-add:hover {
  background: var(--accent); color: #fff; border-style: solid;
  box-shadow: 0 6px 20px rgba(13,148,136,.35);
}

/* STICKY BAR */
.sticky-bar {
  position: fixed; bottom: 0; left: 0; width: 100%;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 1000; box-shadow: 0 -6px 28px rgba(0,0,0,.1);
}
.sticky-inner {
  max-width: 860px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex-wrap: wrap;
}
.count-info { font-size: 13px; color: var(--muted); flex-shrink: 0; }
.count-info strong { color: var(--accent); font-size: 22px; font-weight: 900; }
.bar-actions { display: flex; gap: 8px; flex: 1; justify-content: flex-end; flex-wrap: wrap; }
.btn-preview {
  padding: 11px 16px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; transition: .15s;
  white-space: nowrap; font-family: var(--font);
}
.btn-preview:hover { border-color: var(--accent); color: var(--accent); }
.btn-cetak {
  padding: 11px 16px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; transition: .15s;
  white-space: nowrap; font-family: var(--font);
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.btn-cetak:hover { border-color: #0f9d8f; color: #0f9d8f; }
.btn-nilai {
  padding: 11px 16px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; transition: .15s;
  white-space: nowrap; font-family: var(--font);
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.btn-nilai:hover { border-color: var(--success); color: var(--success); }
.btn-analisis {
  padding: 11px 16px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; transition: .15s;
  white-space: nowrap; font-family: var(--font);
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.btn-analisis:hover { border-color: var(--warn); color: var(--warn); }
.btn-edit {
  padding: 11px 16px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; transition: .15s;
  white-space: nowrap; font-family: var(--font);
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.btn-edit:hover { border-color: var(--info); color: var(--info); }
.btn-clear-local {
  padding: 11px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 12px; font-weight: 700; color: var(--danger); cursor: pointer; transition: .15s;
  white-space: nowrap; font-family: var(--font);
}
.btn-clear-local:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-kirim {
  padding: 11px 20px; border-radius: var(--radius-sm);
  border: none; background: var(--accent);
  font-size: 13px; font-weight: 800; color: #fff; cursor: pointer; transition: .15s;
  display: flex; align-items: center; gap: 7px; white-space: nowrap;
  font-family: var(--font); box-shadow: 0 4px 14px rgba(13,148,136,.35);
}
.btn-kirim:hover { background: #0b7a70; }
.btn-kirim:disabled { opacity: .6; cursor: not-allowed; }
.spinner {
  width: 14px; height: 14px;
  border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff;
  border-radius: 50%; animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* PREVIEW MODAL */
.pv-item {
  border-bottom: 1px solid var(--border);
  padding-bottom: 18px; margin-bottom: 18px;
}
.pv-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
.pv-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.pv-num { font-size: 13px; font-weight: 800; color: var(--accent); }
.pv-kode {
  background: var(--bg); color: var(--muted);
  font-size: 11px; font-weight: 700; padding: 3px 10px;
  border-radius: 99px; border: 1px solid var(--border);
}
.pv-soal { font-size: 14px; font-weight: 600; line-height: 1.6; color: var(--text); margin-bottom: 10px; }
.pv-img { max-width: 100%; max-height: 180px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 10px; display: block; }
.pv-opsi-list { display: flex; flex-direction: column; gap: 6px; }
.pv-opsi {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; border-radius: var(--radius-xs);
  background: var(--bg); border: 1px solid var(--border);
}
.pv-opsi.kunci { background: var(--success-soft); border-color: var(--success); }
.pv-key {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; flex-shrink: 0;
  background: var(--border); color: var(--muted);
}
.pv-opsi.kunci .pv-key { background: var(--success); color: #fff; }
.pv-opsi-text { font-size: 13px; color: var(--text); line-height: 1.5; }
.pv-kunci-badge {
  font-size: 10px; font-weight: 800; color: var(--success);
  margin-left: 6px; padding: 1px 6px;
  background: var(--success-soft); border-radius: 99px; border: 1px solid var(--success);
}
.pv-opsi-img { max-height: 70px; border-radius: var(--radius-xs); margin-top: 5px; display: block; border: 1px solid var(--border); }
.pv-mapel-info {
  background: linear-gradient(135deg,#e6fbf7,#ccfbf1);
  border: 1px solid #7dd8cb;
  border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 16px;
  font-size: 13px; line-height: 1.8;
}
.pv-mapel-info strong { color: #0f9d8f; }

.logo-shine {
  position: relative; width: 104px; height: 105px; margin: 0 auto 12px;
  background: var(--logo-url) center/contain no-repeat;
  filter: drop-shadow(0 0 10px rgba(13,148,136,.35)) drop-shadow(0 6px 10px rgba(15,23,41,.28));
  animation: logoFloat 4.5s ease-in-out infinite;
}
/* kilap statis: pantulan cahaya di bagian atas */
.logo-shine::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(170deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 38%, rgba(255,255,255,0) 52%, rgba(0,0,0,.14) 100%);
  -webkit-mask: var(--logo-url) center/contain no-repeat; mask: var(--logo-url) center/contain no-repeat;
}
/* kilau berjalan */
.logo-shine::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0) 38%, rgba(255,255,255,.95) 50%, rgba(255,255,255,0) 62%, transparent 70%);
  background-size: 250% 100%; background-position: 160% 0; background-repeat: no-repeat;
  -webkit-mask: var(--logo-url) center/contain no-repeat; mask: var(--logo-url) center/contain no-repeat;
  mix-blend-mode: screen; animation: logoShine 3.2s ease-in-out infinite;
}
@keyframes logoShine { 0%{background-position:160% 0} 55%,100%{background-position:-60% 0} }
@keyframes logoFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
@media (prefers-reduced-motion: reduce) { .logo-shine, .logo-shine::after { animation: none; } }

/* ===== EQUATION / RUMUS ===== */
.lbl-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.btn-eq {
  padding: 5px 13px; border-radius: 99px;
  border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--accent);
  font-family: var(--font); font-size: 12px; font-weight: 800; cursor: pointer;
  transition: .15s; white-space: nowrap;
}
.btn-eq:hover, .btn-eq:active { background: var(--accent); color: #fff; }
.opt-eq-toggle {
  width: 32px; height: 32px; border-radius: var(--radius-xs);
  border: 1.5px solid var(--accent-mid); background: var(--accent-soft); color: var(--accent);
  font-size: 15px; font-weight: 800; font-family: var(--font); line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: .15s;
}
.opt-eq-toggle:hover, .opt-eq-toggle:active { background: var(--accent); color: #fff; }

.math-preview {
  margin-top: 6px; padding: 8px 12px;
  background: #f0fdfa; border: 1px dashed var(--accent-mid); border-radius: var(--radius-xs);
  font-size: 15px; line-height: 1.7; overflow-x: auto; color: var(--text);
}
.opt-math-preview { margin: 4px 0 4px 38px; }
.mp-tag {
  font-size: 9px; font-weight: 800; color: var(--accent);
  text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px;
}
.mp-body .katex-display { margin: .5em 0; }

.eq-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.eq-tab {
  padding: 6px 12px; border-radius: 99px; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--muted);
  font-family: var(--font); font-size: 12px; font-weight: 700; cursor: pointer; transition: .15s;
}
.eq-tab:hover { border-color: var(--accent-mid); color: var(--accent); }
.eq-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.eq-palette {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px;
  max-height: 176px; overflow-y: auto; padding: 8px; margin-bottom: 14px;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-xs);
}
.eq-sym {
  height: 44px; padding: 0 4px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 8px; cursor: pointer; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font); font-size: 13px; color: var(--text); transition: .12s;
}
.eq-sym:hover, .eq-sym:active { border-color: var(--accent); background: var(--accent-soft); }
.eq-sym .katex { font-size: 1em; }
.eq-lbl {
  display: block; margin-bottom: 5px;
  font-size: 10px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
}
.eq-input {
  width: 100%; padding: 10px 12px; margin-bottom: 12px;
  border: 1.5px solid var(--border); border-radius: var(--radius-xs);
  font-family: var(--mono); font-size: 13px; line-height: 1.5; color: var(--text);
  background: var(--surface); outline: none; resize: vertical; min-height: 70px;
}
.eq-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,.12); }
.eq-preview {
  min-height: 62px; padding: 12px; margin-bottom: 10px;
  border: 1.5px solid var(--border); border-radius: var(--radius-xs); background: #fff;
  font-size: 18px; overflow-x: auto;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.eq-preview .eq-empty { font-size: 12px; color: var(--muted); }
.eq-preview .eq-err { font-size: 12px; color: var(--danger); font-family: var(--mono); text-align: left; }
.eq-check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 8px; cursor: pointer; }
.eq-hint { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
.eq-hint code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); font-size: 11px; }

/* ===== MOBILE-FRIENDLY ===== */

.soal-card { scroll-margin-top: 20px; }
button, a, input, select, textarea { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

.modal-box { overscroll-behavior: contain; }

  #toast-container { top: calc(10px + env(safe-area-inset-top, 0px)); }
}

@media (max-width: 360px) {

<script>
/* ===== CONFIG ===== */
const LABELS    = ['A','B','C','D','E','F','G','H','I','J','K','L'];
const scriptURL = 'https://script.google.com/macros/s/AKfycbyykFL7T23YhvsOPXKxEPVb13KpjQWWPgWvMhU8euZ9We2StfoIA1Dq4mqv3nB83ySU9Q/exec';
const LS_KEY    = 'ujian_draft_v2';

let soalCount        = 0;
let localSaveTimeout = null;

/* ===== INIT ===== */
window.addEventListener('DOMContentLoaded', () => {
  checkLocalDraft();
});

/* ===== TOAST ===== */
function toast(type, title, msg, duration) {
  duration = duration || 3500;
  const icons = { success:'✓', error:'✕', info:'i', warn:'!' };
  const tc = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML =
    '<div class="toast-icon ' + type + '">' + (icons[type] || 'i') + '</div>' +
    '<div class="toast-body">' +
      '<div class="t-title">' + title + '</div>' +
      (msg ? '<div class="t-msg">' + msg + '</div>' : '') +
    '</div>';
  tc.appendChild(el);
  setTimeout(function() { el.classList.add('out'); setTimeout(function() { el.remove(); }, 350); }, duration);
}

/* ===== MODAL ===== */
function showModal(title, bodyHTML, buttons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML    = bodyHTML;
  var footer = document.getElementById('modal-footer');
  footer.innerHTML = '';
  buttons.forEach(function(b) {
    var btn = document.createElement('button');
    btn.className   = 'modal-btn ' + (b.cls || 'ghost');
    btn.textContent = b.label;
    btn.onclick     = function() { closeModal(); if (b.action) b.action(); };
    footer.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); document.body.style.overflow = ''; }
function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

/* ===== HELPERS ===== */
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function getCachedB64(inputEl) {
  return (inputEl && inputEl.dataset && inputEl.dataset.b64) ? inputEl.dataset.b64 : '';
}

/* ===== LINK GAMBAR & LAMPIRAN FILE ===== */
/* Catatan: dataset.b64 pada input gambar bisa berisi data-URL (hasil upload) ATAU link http(s) */
var MAX_LAMPIRAN = 3 * 1024 * 1024;   /* 3 MB per lampiran */
var quotaWarned  = false;

function isDataUrl(s) { return String(s || '').indexOf('data:') === 0; }

function formatUkuran(b) {
  return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
}

/* Link Google Drive (share link) diubah jadi link gambar langsung */
function normalisasiLink(u) {
  u = (u || '').trim();
  var m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) ||
          u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);
  return m ? 'https://lh3.googleusercontent.com/d/' + m[1] : u;
}

/* Validasi link: harus http(s) dan benar-benar bisa dimuat sebagai gambar */
function cekLinkGambar(raw, btn, cb) {
  var url = normalisasiLink(raw);
  if (!url) { toast('warn', 'Link masih kosong', 'Tempel link gambar terlebih dahulu.'); return; }
  if (!/^https?:\/\/\S+$/i.test(url)) {
    toast('error', 'Link tidak valid', 'Link harus diawali http:// atau https://');
    return;
  }
  var oldTxt = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Cek...'; }

  var img = new Image();
  var selesai = false;
  var timer;
  function akhir(ok) {
    if (selesai) return;
    selesai = true;
    clearTimeout(timer);
    if (btn) { btn.disabled = false; btn.textContent = oldTxt; }
    if (ok) { cb(url); }
    else {
      toast('error', 'Gambar tidak bisa dimuat',
        'Pastikan link langsung ke file gambar (.jpg/.png/.webp) dan bisa dibuka publik.', 5500);
    }
  }
  timer = setTimeout(function() { akhir(false); }, 10000);
  img.onload  = function() { akhir(true); };
  img.onerror = function() { akhir(false); };
  img.referrerPolicy = 'no-referrer';
  img.src = url;
}

function getLampiran(card) {
  var el = card.querySelector('.fileLampiran');
  return {
    data: getCachedB64(el),
    nama: (el && el.dataset.nama) || '',
    size: parseInt(el && el.dataset.size) || 0
  };
}

/* ===== LOCAL SAVE ===== */
function setLocalStatus(state, count) {
  var el = document.getElementById('autosaveStatus');
  if (state === 'saved') {
    el.className = 'autosave-status local';
    el.innerHTML = '<span class="autosave-dot"></span> ' + count + ' soal tersimpan lokal ✓';
  } else {
    el.className = 'autosave-status unsaved';
    el.innerHTML = '<span class="autosave-dot"></span> Ada perubahan belum tersimpan...';
  }
}

function collectDraftData() {
  var draft = {
    savedAt  : new Date().toISOString(),
    baseKode : document.getElementById('baseKode').value,
    global: {
      kode       : document.getElementById('g_kode').value,
      mapel      : document.getElementById('g_mapel').value,
      pwd_mulai  : document.getElementById('g_pwd_mulai').value,
      pwd_selesai: document.getElementById('g_pwd_selesai').value
    },
    soal: []
  };

  document.querySelectorAll('.soal-card').forEach(function(card) {
    var jml  = parseInt(card.querySelector('.jmlPilihan').value) || 4;
    var item = {
      id         : card.id,
      kode       : card.querySelector('.kodeSoal').value,
      soal       : card.querySelector('.soalText').value,
      kunci      : card.querySelector('.kunci').value,
      jml        : jml,
      pilihan    : [],
      gambarSoal : getCachedB64(card.querySelector('.fileSoal')),
      lampiran   : getLampiran(card),
      gambarOpsi : {}
    };
    for (var i = 0; i < jml; i++) {
      var L  = LABELS[i];
      var pEl = card.querySelector('.pilihan' + L);
      item.pilihan.push(pEl ? pEl.value : '');
      var fD = card.querySelector('.opt-file.file' + L);
      var fM = card.querySelector('.opt-file-mobile.file' + L);
      item.gambarOpsi[L] = getCachedB64(fD) || getCachedB64(fM) || '';
    }
    draft.soal.push(item);
  });

  return draft;
}

function saveToLocal() {
  try {
    var draft = collectDraftData();
    localStorage.setItem(LS_KEY, JSON.stringify(draft));
    setLocalStatus('saved', draft.soal.length);
    document.querySelectorAll('.soal-card').forEach(function(card) {
      card.classList.remove('local-unsaved');
      card.classList.add('local-saved');
      var badge = card.querySelector('.card-local-badge');
      if (badge) { badge.className = 'card-local-badge saved'; badge.textContent = '✓ Draft'; }
    });
  } catch(e) {
    setLocalStatus('unsaved', 0);
    console.warn('LocalStorage error:', e);
    if (!quotaWarned) {
      quotaWarned = true;
      toast('warn', 'Draft terlalu besar untuk disimpan lokal',
        'Gambar/file yang diunggah terlalu besar. Kurangi ukurannya atau gunakan link gambar, dan kirim ke server sebelum menutup halaman.', 7000);
    }
  }
}

function triggerLocalSave() {
  clearTimeout(localSaveTimeout);
  setLocalStatus('unsaved', 0);
  document.querySelectorAll('.soal-card').forEach(function(card) {
    card.classList.add('local-unsaved');
    card.classList.remove('local-saved');
    var badge = card.querySelector('.card-local-badge');
    if (badge) { badge.className = 'card-local-badge unsaved'; badge.textContent = '⏳ Belum disimpan'; }
  });
  localSaveTimeout = setTimeout(saveToLocal, 1500);
}

/* ===== CEK & RESTORE DRAFT ===== */
function checkLocalDraft() {
  var raw = localStorage.getItem(LS_KEY);
  if (!raw) { tambahSoal(); return; }

  try {
    var draft = JSON.parse(raw);
    if (!draft.soal || draft.soal.length === 0) {
      localStorage.removeItem(LS_KEY);
      tambahSoal();
      return;
    }
    var tanggal = draft.savedAt
      ? new Date(draft.savedAt).toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })
      : 'tidak diketahui';
    document.getElementById('restoreInfo').textContent =
      draft.soal.length + ' soal · ' + (draft.global && draft.global.mapel ? draft.global.mapel : '—') + ' · ' + tanggal;
    document.getElementById('restoreBanner').style.display = 'flex';
  } catch(e) {
    localStorage.removeItem(LS_KEY);
    tambahSoal();
  }
}

function restoreFromLocal() {
  document.getElementById('restoreBanner').style.display = 'none';
  var raw = localStorage.getItem(LS_KEY);
  if (!raw) { tambahSoal(); return; }

  try {
    var draft = JSON.parse(raw);
    clearTimeout(localSaveTimeout);

    document.getElementById('soalList').innerHTML = '';
    soalCount = 0;

    document.getElementById('baseKode').value      = draft.baseKode                 || '';
    document.getElementById('g_kode').value        = (draft.global && draft.global.kode)        ? draft.global.kode        : '';
    document.getElementById('g_mapel').value       = (draft.global && draft.global.mapel)       ? draft.global.mapel       : '';
    document.getElementById('g_pwd_mulai').value   = (draft.global && draft.global.pwd_mulai)   ? draft.global.pwd_mulai   : '';
    document.getElementById('g_pwd_selesai').value = (draft.global && draft.global.pwd_selesai) ? draft.global.pwd_selesai : '';

    draft.soal.forEach(function(item) {
      tambahSoalDariDraft(item);
      var card = document.getElementById(item.id) || document.querySelector('.soal-card:last-child');
      if (card) restoreImagePreview(card, item);
    });

    updateCounter();
    setLocalStatus('saved', draft.soal.length);
    document.querySelectorAll('.soal-card').forEach(function(card) {
      card.classList.remove('local-unsaved');
      card.classList.add('local-saved');
      var badge = card.querySelector('.card-local-badge');
      if (badge) { badge.className = 'card-local-badge saved'; badge.textContent = '✓ Draft'; }
    });

  } catch(e) {
    toast('error', 'Gagal Memulihkan', 'Format draft tidak valid, memulai baru.');

function discardLocal() {

/* ===== EQUATION (LaTeX via KaTeX) =====
   Format penyimpanan: rumus ditulis di dalam teks soal/pilihan dengan pembatas
     $ ... $    -> rumus sebaris
     $$ ... $$  -> rumus di baris sendiri
   Tanda dolar biasa (mis. harga) tulis sebagai \$ agar tidak dianggap rumus. */
var MATH_RE = /(?<!\\)\$\$([\s\S]+?)\$\$|(?<!\\)\$((?:\\.|[^$\\\n])+?)\$/g;

function renderMath(text) {
  text = String(text == null ? '' : text);
  function plain(s) { return escHtml(s.replace(/\\\$/g, '$')).replace(/\n/g, '<br>'); }
  var out = '', last = 0, m;
  MATH_RE.lastIndex = 0;
  while ((m = MATH_RE.exec(text)) !== null) {
    out += plain(text.slice(last, m.index));
    var display = m[1] !== undefined;
    var tex = (display ? m[1] : m[2]).trim();
    if (window.katex) {
      try {
        out += katex.renderToString(tex, { displayMode: display, throwOnError: false, strict: 'ignore' });
      } catch (e) { out += '<code>' + escHtml(m[0]) + '</code>'; }
    } else {
      out += '<code>' + escHtml(m[0]) + '</code>';
    }
    last = m.index + m[0].length;
  }
  return out + plain(text.slice(last));
}

function mathBoxFor(el) {
  if (el.classList.contains('soalText')) return el.closest('.field-group').querySelector('.math-preview');
  var row = el.closest('.option-row');
  return row ? row.parentElement.querySelector('.math-preview') : null;
}

function refreshMath(el) {
  var box = mathBoxFor(el);
  if (!box) return;
  if (!/(?<!\\)\$/.test(el.value)) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.innerHTML = '<div class="mp-tag">Pratinjau rumus</div><div class="mp-body">' + renderMath(el.value) + '</div>';
  box.style.display = 'block';
}
function refreshCardMath(card) {
  card.querySelectorAll('.soalText, .opt-input').forEach(refreshMath);
}
function refreshAllMath() {
  document.querySelectorAll('.soalText, .opt-input').forEach(refreshMath);
}

/* simpan posisi kursor terakhir tiap kolom (hilang saat tombol Rumus diklik) */
document.addEventListener('focusout', function(e) {
  var t = e.target;
  if (t && t.matches && t.matches('.soalText, .opt-input')) {
    t.dataset.cs = t.selectionStart;
    t.dataset.ce = t.selectionEnd;
  }
});
window.addEventListener('load', refreshAllMath);

/* --- Palet simbol: [label LaTeX, potongan yang disisipkan]; @@ = posisi kursor --- */
function sym(t) { return [t, t + ' ']; }
var EQ_GROUPS = [
  { n: 'Dasar', items: [
    ['\\frac{a}{b}', '\\frac{@@}{}'],
    ['\\sqrt{x}', '\\sqrt{@@}'],
    ['\\sqrt[n]{x}', '\\sqrt[@@]{}'],
    ['x^{n}', '^{@@}'],
    ['x_{n}', '_{@@}'],
    ['x_{i}^{n}', '_{@@}^{}'],
    ['(\\,)', '\\left(@@\\right)'],
    ['|x|', '\\left|@@\\right|'],
    sym('\\times'), sym('\\div'), sym('\\pm'), sym('\\mp'), sym('\\cdot'),
    sym('\\neq'), sym('\\approx'), sym('\\leq'), sym('\\geq'), sym('<'), sym('>'),
    ['\\%', '\\% ']
  ]},
  { n: 'Simbol', items: [
    sym('\\infty'), ['^{\\circ}', '^{\\circ} '], sym('\\angle'), sym('\\triangle'), sym('\\perp'),
    sym('\\parallel'), sym('\\cong'), sym('\\sim'), sym('\\therefore'), sym('\\because'),
    sym('\\in'), sym('\\notin'), sym('\\subset'), sym('\\subseteq'), sym('\\cup'), sym('\\cap'),
    sym('\\emptyset'), sym('\\forall'), sym('\\exists'), sym('\\to'), sym('\\Rightarrow'),
    sym('\\Leftrightarrow'), sym('\\propto'), sym('\\ldots'),
    ['\\mathbb{R}', '\\mathbb{R} '], ['\\mathbb{N}', '\\mathbb{N} '], ['\\mathbb{Z}', '\\mathbb{Z} '], ['\\mathbb{Q}', '\\mathbb{Q} ']
  ]},
  { n: 'Yunani', items: [
    sym('\\alpha'), sym('\\beta'), sym('\\gamma'), sym('\\delta'), sym('\\varepsilon'), sym('\\theta'),
    sym('\\lambda'), sym('\\mu'), sym('\\pi'), sym('\\rho'), sym('\\sigma'), sym('\\tau'),
    sym('\\phi'), sym('\\omega'), sym('\\Delta'), sym('\\Sigma'), sym('\\Phi'), sym('\\Omega')
  ]},
  { n: 'Kalkulus', items: [
    ['\\sum_{i=1}^{n}', '\\sum_{i=1}^{@@} '],
    ['\\prod_{i=1}^{n}', '\\prod_{i=1}^{@@} '],
    ['\\int_{a}^{b}', '\\int_{@@}^{} \\,dx'],
    ['\\lim_{x\\to a}', '\\lim_{x \\to @@} '],
    ['\\frac{d}{dx}', '\\frac{d}{dx}@@'],
    ['\\log_{a}', '\\log_{@@} '],
    sym('\\ln'), sym('\\sin'), sym('\\cos'), sym('\\tan'),
    ['\\binom{n}{k}', '\\binom{@@}{}'],
    ['n!', '! ']
  ]},
  { n: 'Matriks & Garis', items: [
    ['\\begin{pmatrix}a&b\\\\c&d\\end{pmatrix}', '\\begin{pmatrix} @@ &  \\\\  &  \\end{pmatrix}'],
    ['\\begin{vmatrix}a&b\\\\c&d\\end{vmatrix}', '\\begin{vmatrix} @@ &  \\\\  &  \\end{vmatrix}'],
    ['\\begin{cases}x\\\\y\\end{cases}', '\\begin{cases} @@ \\\\  \\end{cases}'],
    ['\\overline{AB}', '\\overline{@@}'],
    ['\\overrightarrow{AB}', '\\overrightarrow{@@}'],
    ['\\vec{v}', '\\vec{@@}'],
    ['\\hat{x}', '\\hat{@@}'],
    ['\\bar{x}', '\\bar{@@}'],
    ['\\widehat{ABC}', '\\widehat{@@}'],
    ['\\text{teks}', '\\text{@@}']
  ]},
  { n: 'Sains', items: [
    ['\\mathrm{H_{2}O}', '\\mathrm{H_{2}O} '],
    ['\\mathrm{CO_{2}}', '\\mathrm{CO_{2}} '],
    ['\\mathrm{Na^{+}}', '\\mathrm{Na^{+}} '],
    ['\\mathrm{SO_{4}^{2-}}', '\\mathrm{SO_{4}^{2-}} '],
    ['\\mathrm{x}', '\\mathrm{@@}'],
    sym('\\rightarrow'), sym('\\rightleftharpoons'), sym('\\uparrow'), sym('\\downarrow'),
    ['\\xrightarrow{\\Delta}', '\\xrightarrow{@@}'],
    ['\\vec{F}', '\\vec{F} '],
    ['\\text{ m/s}^{2}', '\\text{ m/s}^{2} '],
    ['\\text{ kg}', '\\text{ kg} '],
    sym('\\Omega'), sym('\\mu'), sym('\\lambda')
  ]}
];

var EQ = { el: null, start: 0, end: 0, group: 0 };

function eqById(id) { return document.getElementById(id); }

function bukaEquation(btn) {
  var row = btn.closest('.option-row');
  var field = row ? row.querySelector('.opt-input') : btn.closest('.field-group').querySelector('.soalText');
  if (!field) return;

  var val = field.value;
  var s = field.dataset.cs !== undefined ? parseInt(field.dataset.cs) : val.length;
  var e = field.dataset.ce !== undefined ? parseInt(field.dataset.ce) : val.length;
  if (isNaN(s) || isNaN(e)) { s = e = val.length; }
  s = Math.min(s, val.length); e = Math.min(e, val.length);

  /* kalau kursor berada di dalam rumus yang sudah ada -> mode edit */
  var prefill = '', isDisplay = false, editing = false, m;
  MATH_RE.lastIndex = 0;
  while ((m = MATH_RE.exec(val)) !== null) {
    var a = m.index, b = m.index + m[0].length;
    if (s >= a && e <= b && !(s === a && e === a)) {
      s = a; e = b; editing = true;
      isDisplay = m[1] !== undefined;
      prefill = (isDisplay ? m[1] : m[2]).trim();
      break;
    }
  }
  if (!editing && e > s) prefill = val.slice(s, e).replace(/\n/g, ' ');

  EQ.el = field; EQ.start = s; EQ.end = e; EQ.group = 0;

  var tabs = EQ_GROUPS.map(function(g, i) {
    return '<button type="button" class="eq-tab' + (i === 0 ? ' active' : '') + '" data-g="' + i + '">' + g.n + '</button>';
  }).join('');

  var body =
    '<div class="eq-tabs">' + tabs + '</div>' +
    '<div class="eq-palette" id="eq-palette"></div>' +
    '<label class="eq-lbl" for="eq-input">Kode rumus (LaTeX) — klik simbol di atas atau ketik langsung</label>' +
    '<textarea id="eq-input" class="eq-input" spellcheck="false" autocapitalize="off" autocomplete="off" ' +
      'placeholder="Contoh: x = \\frac{-b \\pm \\sqrt{b^{2}-4ac}}{2a}"></textarea>' +
    '<div class="eq-lbl">Pratinjau</div>' +
    '<div class="eq-preview" id="eq-preview"></div>' +
    '<label class="eq-check"><input type="checkbox" id="eq-display"> Tampilkan di baris tersendiri (besar &amp; rata tengah)</label>' +
    '<div class="eq-hint">Tips: blok teks lebih dulu lalu klik simbol (mis. pecahan/akar) agar teks terpilih masuk ke dalamnya. ' +
    'Rumus tersimpan dalam teks sebagai <code>$...$</code>. Untuk tanda dolar biasa tulis <code>\\$</code>.</div>';

  showModal(editing ? 'Edit Rumus' : 'Sisipkan Rumus', body, [
    { label: 'Batal', cls: 'ghost' },
    { label: editing ? 'Simpan Rumus' : 'Sisipkan Rumus', cls: 'primary', action: sisipkanEquation }
  ]);

  eqById('eq-input').value = prefill;
  eqById('eq-display').checked = isDisplay;
  eqById('eq-input').addEventListener('input', updateEqPreview);
  eqById('eq-display').addEventListener('change', updateEqPreview);
  document.querySelectorAll('#modal-body .eq-tab').forEach(function(t) {
    t.addEventListener('click', function() {
      document.querySelectorAll('#modal-body .eq-tab').forEach(function(x) { x.classList.remove('active'); });
      t.classList.add('active');
      renderEqPalette(parseInt(t.dataset.g));
    });
  });
  renderEqPalette(0);
  updateEqPreview();
  setTimeout(function() {
    var ta = eqById('eq-input');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }, 60);
}

function renderEqPalette(gi) {
  var pal = eqById('eq-palette');
  pal.innerHTML = '';
  EQ_GROUPS[gi].items.forEach(function(it) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'eq-sym';
    b.title = it[1].replace('@@', '').trim();
    if (window.katex) {
      try { b.innerHTML = katex.renderToString(it[0], { throwOnError: false, strict: 'ignore' }); }
      catch (e) { b.textContent = it[0]; }
    } else { b.textContent = it[0]; }
    b.addEventListener('mousedown', function(ev) { ev.preventDefault(); });
    b.addEventListener('click', function() { eqSisipSnippet(it[1]); });
    pal.appendChild(b);
  });
}

function eqSisipSnippet(snip) {
  var ta  = eqById('eq-input');
  var pos = snip.indexOf('@@');
  var txt = snip.replace('@@', '');
  var s = ta.selectionStart, e = ta.selectionEnd;
  var sel = ta.value.slice(s, e);
  var caret;
  if (sel && pos >= 0) {
    txt = txt.slice(0, pos) + sel + txt.slice(pos);
    caret = s + pos + sel.length;
  } else {
    caret = s + (pos >= 0 ? pos : txt.length);
  }
  ta.value = ta.value.slice(0, s) + txt + ta.value.slice(e);
  ta.focus();
  ta.setSelectionRange(caret, caret);
  updateEqPreview();
}

function updateEqPreview() {
  var box = eqById('eq-preview');
  var tex = eqById('eq-input').value.trim();
  if (!tex) { box.innerHTML = '<span class="eq-empty">Rumus akan tampil di sini</span>'; return; }
  if (!window.katex) {
    box.innerHTML = '<span class="eq-err">Pustaka KaTeX belum termuat (perlu koneksi internet). Rumus tetap bisa disisipkan.</span>';
    return;
  }
  try {
    box.innerHTML = katex.renderToString(tex, {
      displayMode: eqById('eq-display').checked, throwOnError: true, strict: 'ignore'
    });
  } catch (err) {
    box.innerHTML = '<span class="eq-err">Rumus belum valid: ' + escHtml(String(err.message || err).replace(/^KaTeX parse error:\s*/, '')) + '</span>';
  }
}

function sisipkanEquation() {
  var tex = eqById('eq-input').value.trim();
  if (!tex || !EQ.el) return;
  var disp = eqById('eq-display').checked;
  tex = tex.replace(/\$/g, '').replace(/\s*\n\s*/g, ' ');
  var wrapped = disp ? '$$' + tex + '$$' : '$' + tex + '$';
  var v = EQ.el.value;
  EQ.el.value = v.slice(0, EQ.start) + wrapped + v.slice(EQ.end);
  var caret = EQ.start + wrapped.length;
  EQ.el.focus();
  EQ.el.setSelectionRange(caret, caret);
  EQ.el.dataset.cs = caret; EQ.el.dataset.ce = caret;
  refreshMath(EQ.el);
  triggerLocalSave();
  toast('success', 'Rumus disisipkan', 'Pratinjau tampil di bawah kolom.', 2200);
}

/* ===== TAMBAH SOAL ===== */
function tambahSoal() {
  soalCount++;
  var container = document.getElementById('soalList');
  var baseKode  = document.getElementById('baseKode').value.trim() || 'SOAL';

  var prev = { jml: 4, kunci: '', pilihan: [] };
  var allCards = container.querySelectorAll('.soal-card');
  var lastCard = allCards[allCards.length - 1];
  if (lastCard) {
    prev.jml   = parseInt(lastCard.querySelector('.jmlPilihan').value) || 4;
    prev.kunci = lastCard.querySelector('.kunci').value;
    for (var i = 0; i < prev.jml; i++) {
      var pEl = lastCard.querySelector('.pilihan' + LABELS[i]);
      prev.pilihan[i] = pEl ? pEl.value : '';
    }
  }

  buatKartu(soalCount, {
    id     : 'card-' + soalCount,
    kode   : baseKode + '-' + soalCount,
    soal   : '',
    kunci  : prev.kunci,
    jml    : prev.jml,
    pilihan: prev.pilihan
  });
  updateCounter();
  triggerLocalSave();
  setTimeout(function() { var cs = document.querySelectorAll('.soal-card'); var last = cs[cs.length - 1]; if (last) last.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
}

function tambahSoalDariDraft(item) {
  soalCount++;
  buatKartu(soalCount, item);
}

    '</div>' +

    '<div class="file-section lampiran-section">' +
      '<label>Lampiran File (opsional) — PDF, Word, Excel, audio, dll. Maks. 3 MB</label>' +
      '<input type="file" class="fi-file fileLampiran" onchange="handleFileLampiran(this)">' +
      '<div class="lampiran-chip" style="display:none">' +
        '<span>📎</span>' +
        '<span class="lampiran-nama"></span>' +
        '<span class="lampiran-size"></span>' +
        '<button type="button" class="btn-del-mini" onclick="hapusLampiran(this)">✕ Hapus</button>' +
      '</div>' +
    '</div>' +

    '<div class="opsi-wrapper"></div>' +

    '<div class="kunci-row">' +
      '<label>Kunci Jawaban</label>' +
      '<input type="text" class="kunci-input kunci" maxlength="2" placeholder="A"' +
             ' value="' + escHtml(item.kunci || '') + '" oninput="triggerLocalSave()">' +
    '</div>';

  container.appendChild(div);
  renderOpsi(div.querySelector('.opsi-wrapper'), item.jml || 4, item.pilihan || [], div.id);
  refreshCardMath(div);
}

/* ===== RENDER OPSI ===== */
function buatOpsiRow(L, cardId, val) {
  var pid  = 'mfile-' + cardId + '-' + L;
  var wrap = document.createElement('div');
  wrap.innerHTML =
    '<div class="option-row">' +
      '<div class="opt-label">' + L + '</div>' +
      '<input type="text" class="opt-input pilihan' + L + '"' +
             ' value="' + escHtml(val || '') + '"' +
             ' placeholder="Pilihan jawaban ' + L + '"' +
             ' oninput="triggerLocalSave();refreshMath(this)">' +
      '<button type="button" class="opt-eq-toggle" onclick="bukaEquation(this)" title="Sisipkan rumus">∑</button>' +
      '<input type="file" class="opt-file file' + L + '" data-pid="' + pid + '" accept="image/*"' +
             ' onchange="handleFileOpsi(this)">' +
      '<button type="button" class="opt-img-toggle"' +
              ' onclick="toggleOptFile(this,\'' + pid + '\')" title="Tambah gambar">📎</button>' +
      '<button type="button" class="opt-link-toggle"' +
              ' onclick="toggleLinkOpsi(this)" title="Pakai link gambar">🔗</button>' +
      '<input type="file" class="opt-file-mobile file' + L + '" id="' + pid + '" data-pid="' + pid + '" accept="image/*"' +
             ' onchange="handleFileOpsi(this)">' +
    '</div>' +
    '<div class="math-preview opt-math-preview" style="display:none"></div>' +
    '<div class="opt-link-row">' +
      '<input type="url" class="fi opt-link-input" placeholder="Tempel link gambar pilihan ' + L + ' (https://...)"' +
             ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();pasangLinkOpsi(this);}">' +
      '<button type="button" class="btn-link" onclick="pasangLinkOpsi(this)">Pasang</button>' +
    '</div>';
  return wrap;
}

function renderOpsi(wrapperEl, jml, savedPilihan, cardId) {
  wrapperEl.innerHTML = '';
  for (var i = 0; i < jml; i++) {
    wrapperEl.appendChild(buatOpsiRow(LABELS[i], cardId, savedPilihan[i]));
  }
}

/* Tambah/kurangi opsi tanpa menghapus isi opsi yang sudah ada */
function setJmlOpsi(card, n) {
  var wrapper = card.querySelector('.opsi-wrapper');
  while (wrapper.children.length > n) wrapper.lastElementChild.remove();
  while (wrapper.children.length < n) {
    wrapper.appendChild(buatOpsiRow(LABELS[wrapper.children.length], card.id, ''));
  }
  card.querySelector('.jmlPilihan').value = n;
  triggerLocalSave();
}

function ubahJmlOpsi(btn, delta) {
  var card = btn.closest('.soal-card');
  var next = (parseInt(card.querySelector('.jmlPilihan').value) || 4) + delta;
  if (next > 12) { toast('warn', 'Maksimal 12 Opsi', ''); return; }
  if (next < 2)  { toast('warn', 'Minimal 2 Opsi', ''); return; }
  setJmlOpsi(card, next);
}

/* ===== HANDLER GAMBAR, LINK & LAMPIRAN ===== */

/* --- Gambar soal --- */
function setGambarSoal(section, src) {
  var fileEl = section.querySelector('.fileSoal');
  fileEl.dataset.b64 = src;
  if (!isDataUrl(src)) fileEl.value = '';
  var wrap = section.querySelector('.img-preview-wrap');
  var img  = wrap.querySelector('.img-preview-soal');
  img.referrerPolicy = 'no-referrer';
  img.src = src;
  wrap.style.display = 'block';
  var note = wrap.querySelector('.img-src-note');
  if (isDataUrl(src)) { note.style.display = 'none'; note.textContent = ''; }
  else { note.style.display = 'block'; note.textContent = '🔗 Dari link: ' + src; }
}

function handleFileSoal(inputEl) {
  var file = inputEl.files[0];
  if (!file) return;
  if (file.type.indexOf('image/') !== 0) {
    toast('error', 'Bukan file gambar', 'Untuk file non-gambar gunakan kolom Lampiran File.');
    inputEl.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    setGambarSoal(inputEl.closest('.file-section'), e.target.result);
    triggerLocalSave();
  };
  reader.readAsDataURL(file);
}

function pasangLinkSoal(el) {
  var section = el.closest('.file-section');
  var inp = section.querySelector('.linkSoal');
  var btn = section.querySelector('.link-row .btn-link');
  cekLinkGambar(inp.value, btn, function(url) {
    setGambarSoal(section, url);
    inp.value = '';
    triggerLocalSave();
    toast('success', 'Gambar dari link dipasang', '');
  });
}

function hapusGambarSoal(btn) {
  var section = btn.closest('.file-section');
  var fileEl  = section.querySelector('.fileSoal');
  fileEl.value       = '';
  fileEl.dataset.b64 = '';
  section.querySelector('.linkSoal').value = '';
  section.querySelector('.img-preview-wrap').style.display = 'none';
  triggerLocalSave();
}

/* --- Gambar pilihan --- */
function tampilPreviewOpsi(row, src) {
  var mob    = row.querySelector('.opt-file-mobile');
  var wrapId = 'opt-prev-' + mob.id;
  var prev   = document.getElementById(wrapId);

  if (!prev) {
    prev    = document.createElement('div');
    prev.id = wrapId;
    prev.style.cssText = 'margin:4px 0 4px 38px;display:flex;align-items:center;gap:8px';

    var img = document.createElement('img');
    img.style.cssText = 'max-height:60px;max-width:55%;border-radius:6px;border:1px solid var(--border)';
    img.referrerPolicy = 'no-referrer';

    var delBtn = document.createElement('button');
    delBtn.type      = 'button';
    delBtn.className = 'btn-del-mini';
    delBtn.dataset.wrapid = wrapId;
    delBtn.textContent = '✕ Hapus';
    delBtn.onclick = function() { hapusGambarOpsi(this.dataset.wrapid); };

    prev.appendChild(img);
    prev.appendChild(delBtn);
    row.insertAdjacentElement('afterend', prev);
  }
  prev.querySelector('img').src = src;
  prev.style.display = 'flex';
}

/* src = data-URL (upload) atau link http(s) */
function setOpsiImage(row, src) {
  row.querySelectorAll('input[type="file"]').forEach(function(el) {
    el.dataset.b64 = src;
    if (!isDataUrl(src)) el.value = '';
  });
  tampilPreviewOpsi(row, src);
}

function handleFileOpsi(inputEl) {
  var file = inputEl.files[0];
  if (!file) return;
  if (file.type.indexOf('image/') !== 0) {
    toast('error', 'Bukan file gambar', 'Pilihan jawaban hanya bisa diberi gambar.');
    inputEl.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    setOpsiImage(inputEl.closest('.option-row'), e.target.result);
    triggerLocalSave();
  };
  reader.readAsDataURL(file);
}

function toggleLinkOpsi(btn) {
  var linkRow = btn.closest('.option-row').parentElement.querySelector('.opt-link-row');
  linkRow.classList.toggle('show');
  if (linkRow.classList.contains('show')) linkRow.querySelector('input').focus();
}

function pasangLinkOpsi(el) {
  var linkRow = el.closest('.opt-link-row');
  var row     = linkRow.parentElement.querySelector('.option-row');
  var inp     = linkRow.querySelector('.opt-link-input');
  var btn     = linkRow.querySelector('.btn-link');
  cekLinkGambar(inp.value, btn, function(url) {
    setOpsiImage(row, url);
    inp.value = '';
    linkRow.classList.remove('show');
    triggerLocalSave();
    toast('success', 'Gambar dari link dipasang', '');
  });
}

function hapusGambarOpsi(wrapId) {
  var prev = document.getElementById(wrapId);
  if (!prev) return;
  var row = prev.parentElement.querySelector('.option-row');
  if (row) {
    row.querySelectorAll('input[type="file"]').forEach(function(el) {
      el.value = ''; el.dataset.b64 = '';
    });
  }
  prev.style.display = 'none';
  triggerLocalSave();
}

/* --- Lampiran file soal --- */
function tampilLampiran(section, nama, size) {
  section.querySelector('.lampiran-nama').textContent = nama || 'Lampiran';
  section.querySelector('.lampiran-size').textContent = size ? formatUkuran(size) : '';
  section.querySelector('.lampiran-chip').style.display = 'flex';
}

function handleFileLampiran(inputEl) {
  var file = inputEl.files[0];
  if (!file) return;
  if (file.size > MAX_LAMPIRAN) {
    toast('error', 'File terlalu besar',
      escHtml(file.name) + ' berukuran ' + formatUkuran(file.size) + '. Maksimal 3 MB per lampiran.', 5000);
    inputEl.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    inputEl.dataset.b64  = e.target.result;
    inputEl.dataset.nama = file.name;
    inputEl.dataset.size = file.size;
    tampilLampiran(inputEl.closest('.file-section'), file.name, file.size);
    triggerLocalSave();
  };
  reader.readAsDataURL(file);
}

function hapusLampiran(btn) {
  var section = btn.closest('.file-section');
  var el = section.querySelector('.fileLampiran');
  el.value = '';
  el.dataset.b64 = ''; el.dataset.nama = ''; el.dataset.size = '';
  section.querySelector('.lampiran-chip').style.display = 'none';
  triggerLocalSave();
}

/* --- Pulihkan dari draft --- */
function restoreImagePreview(card, item) {
  if (item.gambarSoal) {
    var fs = card.querySelector('.fileSoal');
    if (fs) setGambarSoal(fs.closest('.file-section'), item.gambarSoal);
  }

  if (item.lampiran && item.lampiran.data) {
    var fl = card.querySelector('.fileLampiran');
    if (fl) {
      fl.dataset.b64  = item.lampiran.data;
      fl.dataset.nama = item.lampiran.nama || '';
      fl.dataset.size = item.lampiran.size || 0;
      tampilLampiran(fl.closest('.file-section'), item.lampiran.nama, item.lampiran.size);
    }
  }

  if (item.gambarOpsi) {
    Object.entries(item.gambarOpsi).forEach(function(entry) {
      var L   = entry[0];
      var src = entry[1];
      if (!src) return;
      var fM = card.querySelector('.opt-file-mobile.file' + L);
      if (!fM) return;
      setOpsiImage(fM.closest('.option-row'), src);
    });
  }
}

/* ===== HAPUS SOAL ===== */
function hapusSoal(cardId) {
  showModal(
    'Hapus Soal Ini?',
    '<p style="font-size:14px;color:var(--muted);line-height:1.6">Soal yang dihapus tidak dapat dikembalikan. Lanjutkan?</p>',
    [
      { label: 'Batal', cls: 'ghost' },
      { label: 'Hapus', cls: 'danger', action: function() {
        var el = document.getElementById(cardId);
        if (el) el.remove();
        updateCounter();
        triggerLocalSave();
        toast('info', 'Soal Dihapus', 'Soal berhasil dihapus.');
      }}
    ]
  );
}

function updateCounter() {
  document.getElementById('counter').textContent = document.querySelectorAll('.soal-card').length;
}

/* ===== PREVIEW ===== */
function showPreviewModal() {
  var cards = document.querySelectorAll('.soal-card');
  if (!cards.length) { toast('warn', 'Belum Ada Soal', 'Tambahkan soal terlebih dahulu.'); return; }

  var kode   = document.getElementById('g_kode').value   || '—';
  var mapel  = document.getElementById('g_mapel').value  || '—';
  var pwdMul = document.getElementById('g_pwd_mulai').value   ? '✓ Diisi' : '✗ Kosong';
  var pwdSel = document.getElementById('g_pwd_selesai').value ? '✓ Diisi' : '✗ Kosong';

  var bodyHTML =
    '<div class="pv-mapel-info">' +
      '<strong>Kode:</strong> ' + kode + ' &nbsp;|&nbsp; ' +
      '<strong>Mapel:</strong> ' + mapel + '<br>' +
      '<strong>Password Mulai:</strong> ' + pwdMul + ' &nbsp;|&nbsp; ' +
      '<strong>Password Selesai:</strong> ' + pwdSel +
    '</div>';

  cards.forEach(function(card, idx) {
    var kode2    = card.querySelector('.kodeSoal').value || 'TANPA KODE';
    var soalText = card.querySelector('.soalText').value || '(Soal kosong)';
    var jml      = parseInt(card.querySelector('.jmlPilihan').value);
    var kunci    = card.querySelector('.kunci').value.toUpperCase();
    var fileSoal = card.querySelector('.fileSoal').files[0];
    var soalB64  = getCachedB64(card.querySelector('.fileSoal'));

    bodyHTML +=
      '<div class="pv-item">' +
        '<div class="pv-top">' +
          '<span class="pv-num">Soal #' + (idx + 1) + '</span>' +
          '<span class="pv-kode">' + kode2 + '</span>' +
        '</div>' +
        '<div class="pv-soal">' + renderMath(soalText) + '</div>';

    if (soalB64) {
      bodyHTML += '<img src="' + soalB64 + '" class="pv-img">';
    } else if (fileSoal) {
      bodyHTML += '<img src="' + URL.createObjectURL(fileSoal) + '" class="pv-img">';
    }

    var lam = getLampiran(card);
    if (lam.data) {
      bodyHTML += '<div class="pv-lampiran">📎 ' + escHtml(lam.nama || 'Lampiran') +
                  (lam.size ? ' · ' + formatUkuran(lam.size) : '') + '</div>';
    }

    bodyHTML += '<div class="pv-opsi-list">';
    for (var i = 0; i < jml; i++) {
      var L     = LABELS[i];
      var txt   = (card.querySelector('.pilihan' + L) && card.querySelector('.pilihan' + L).value) || '(Kosong)';
      var fD    = card.querySelector('.opt-file.file' + L);
      var fM    = card.querySelector('.opt-file-mobile.file' + L);
      var opsiB64 = getCachedB64(fD) || getCachedB64(fM) || '';
      var isK   = L === kunci;

      bodyHTML +=
        '<div class="pv-opsi' + (isK ? ' kunci' : '') + '">' +
          '<div class="pv-key">' + L + '</div>' +
          '<div>' +
            '<div class="pv-opsi-text">' + renderMath(txt) + (isK ? '<span class="pv-kunci-badge">KUNCI</span>' : '') + '</div>' +
            (opsiB64 ? '<img src="' + opsiB64 + '" class="pv-opsi-img">' : '') +
          '</div>' +
        '</div>';
    }
    bodyHTML += '</div></div>';
  });

  showModal('Preview (' + cards.length + ' soal)', bodyHTML, [{ label: 'Tutup', cls: 'ghost' }]);
}

/* ===== KIRIM KE SERVER ===== */
var toBase64 = function(file) {
  return new Promise(function(resolve) {
    if (!file) { resolve(null); return; }
    var r = new FileReader();
    r.readAsDataURL(file);
    r.onload = function() { resolve(r.result); };
  });
};

function validateGlobal() {
  if (!document.getElementById('g_kode').value.trim())        { toast('error', 'Kode Mata Pelajaran kosong', 'Isi di panel informasi mata pelajaran.'); return false; }
  if (!document.getElementById('g_mapel').value.trim())       { toast('error', 'Nama Mata Pelajaran kosong', 'Isi di panel informasi mata pelajaran.'); return false; }
  if (!document.getElementById('g_pwd_mulai').value.trim())   { toast('error', 'Password Mulai kosong', 'Isi di panel informasi mata pelajaran.'); return false; }
  if (!document.getElementById('g_pwd_selesai').value.trim()) { toast('error', 'Password Selesai kosong', 'Isi di panel informasi mata pelajaran.'); return false; }
  return true;
}

function kirimSemuaData() {
  var cards = document.querySelectorAll('.soal-card');
  if (!cards.length) { toast('warn', 'Belum Ada Soal', 'Tambahkan soal terlebih dahulu.'); return; }
  if (!validateGlobal()) return;

  showModal(
    'Kirim ke Server?',
    '<p style="font-size:14px;color:var(--muted);line-height:1.6">' +
      'Akan mengirim <strong style="color:var(--accent)">' + cards.length + ' soal</strong> ' +
      'mata pelajaran <strong style="color:var(--text)">' + document.getElementById('g_mapel').value + '</strong> ' +
      'ke server.<br><br>' +
      '<span style="color:var(--success);font-weight:700">✓ Setiap soal hanya akan dikirim SATU KALI — tidak ada duplikasi.</span>' +
    '</p>',
    [
      { label: 'Batal', cls: 'ghost' },
      { label: 'Ya, Kirim', cls: 'primary', action: prosesKirim }
    ]
  );
}

async function prosesKirim() {
  var cards   = document.querySelectorAll('.soal-card');
  var btn     = document.getElementById('btnKirim');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Mengirim...';

  toast('info', 'Memproses Data', 'Sedang mengompres gambar dan mengirim soal...');

  var kodeMapel  = document.getElementById('g_kode').value.trim();
  var namaMapel  = document.getElementById('g_mapel').value.trim();
  var pwdMulai   = document.getElementById('g_pwd_mulai').value.trim();
  var pwdSelesai = document.getElementById('g_pwd_selesai').value.trim();

  var berhasil = 0;
  var gagal    = 0;

  for (var ci = 0; ci < cards.length; ci++) {
    var card = cards[ci];
    var jml  = parseInt(card.querySelector('.jmlPilihan').value) || 4;
    var fileSoalEl = card.querySelector('.fileSoal');

    var obj = {
      action: 'inputSoal',
      data: {
        'kode mata pelajaran': kodeMapel,
        'mata pelajaran'     : namaMapel,
        'pasword mulai'      : pwdMulai,
        'pasword selesai'    : pwdSelesai,
        'kode soal'          : card.querySelector('.kodeSoal').value.trim(),
        'soal'               : card.querySelector('.soalText').value.trim(),
        'gambar soal'        : getCachedB64(fileSoalEl) || (await toBase64(fileSoalEl && fileSoalEl.files[0])) || '',
        'kunci jawaban'      : card.querySelector('.kunci').value.trim().toUpperCase()
      }
    };

    var lamEl = card.querySelector('.fileLampiran');
    obj.data['lampiran soal'] = getCachedB64(lamEl);
    obj.data['nama lampiran'] = (lamEl && lamEl.dataset.nama) || '';

    for (var i = 0; i < 12; i++) {
      var L  = LABELS[i];
      var fD = card.querySelector('.opt-file.file' + L);
      var fM = card.querySelector('.opt-file-mobile.file' + L);
      if (i < jml) {
        var pEl = card.querySelector('.pilihan' + L);
        obj.data['opt_' + L]        = pEl ? pEl.value : '';
        obj.data['gambar opt_' + L] = getCachedB64(fD) || getCachedB64(fM) || '';
      } else {
        obj.data['opt_' + L]        = '';
        obj.data['gambar opt_' + L] = '';
      }
    }

    try {
      await fetch(scriptURL, {
        method : 'POST',
        mode   : 'no-cors',
        cache  : 'no-cache',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify(obj)
      });
      berhasil++;
    } catch(e) {
      gagal++;
    }
  }

  btn.disabled  = false;
  btn.innerHTML = 'Kirim ke Server →';

  if (gagal === 0) {
    localStorage.removeItem(LS_KEY);
    showModal(
      '🎉 Berhasil Dikirim!',
      '<div style="text-align:center;padding:10px 0">' +
        '<div style="font-size:48px;margin-bottom:12px">🎉</div>' +
        '<p style="font-size:14px;color:var(--muted);line-height:1.7">' +
          '<strong style="color:var(--text)">' + berhasil + ' soal</strong> berhasil dikirim ke Google Sheets.<br>' +
          'Draft lokal telah dibersihkan.<br>' +
          'Silakan cek sheet <strong>soal</strong> pada spreadsheet Anda.' +
        '</p>' +
      '</div>',
      [{ label: 'Input Soal Baru', cls: 'primary', action: function() { location.reload(); } }]
    );
  } else {
    toast('error', 'Sebagian Gagal', berhasil + ' soal berhasil, ' + gagal + ' soal gagal dikirim.');
  }
}
</script>
